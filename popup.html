<!DOCTYPE html>
<html>

<head>
    <title>Auth Token Sniffer</title>
    <style>
        body {
            width: 400px;
            padding: 10px;
            font-family: Arial, sans-serif;
        }

        .token-item {
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 10px;
            border-radius: 4px;
        }

        .url {
            color: #666;
            font-size: 0.9em;
        }

        .token {
            word-break: break-all;
            background: #f5f5f5;
            padding: 5px;
            margin: 5px 0;
        }

        .timestamp {
            color: #999;
            font-size: 0.8em;
        }

        .method {
            display: inline-block;
            padding: 2px 6px;
            background: #e0e0e0;
            border-radius: 3px;
            font-size: 0.8em;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <h2>Captured Authorization Tokens</h2>
    <div id="tokens"></div>
    <script src="popup.js"></script>
</body>

</html>
